name: Build and Deploy
run-name:  ${{ github.ref_name }} - "${{ github.event.head_commit.message }}"
on:
  pull_request:
    paths:
      - 'generator/**'
      - '.github/workflows/build**'
  push:
    branches:
      - main
    paths:
      - 'generator/**'
      - '.github/workflows/build**'

env:
  GLOBAL_PAT: ${{ secrets.CICD_TOKEN }} # Set PAT as a global environment variable # TODO: likely get rid of
  AWS_REGION: us-east-2

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate-markdown:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - run: echo "hello world"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info # TODO: ok??? probably dont
      - name: Fix workspace permissions
        run: sudo chown -R $USER:$USER ${{ github.workspace }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          # GitHub token for authentication
          token: ${{ github.token }}
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Debug OIDC Claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: '${{ github.server_url }}/${{ github.repository_owner }}'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_RUNNER_ROLE }}
          audience: sts.amazonaws.com
          aws-region: us-east-2
          role-session-name: cv-deployment
      - name: temp
        run: aws sts get-caller-identity
      - name: Make quartz dirs
        run: mkdir -p ./quartz/content
      - name: Create Generator
        run: go build -o generate ./generator && chmod 777 generate
      - name: Generate and fix permissions
        run: sudo ./generate
      - name: Fix permissions
        run: sudo chown -R $USER:$USER . && chmod -R 777 ./quartz/content
      - uses: actions/upload-artifact@v4
        with:
          name: markdownFiles
          path: quartz/content
          if-no-files-found: error
          retention-days: 1
          # The level of compression for Zlib to be applied to the artifact archive.
          # The value can range from 0 to 9.
          # For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
          # Optional. Default is '6'
          compression-level: 6
          overwrite: true
          # Whether to include hidden files in the provided path in the artifact
          # The file contents of any hidden files in the path should be validated before
          # enabled this to avoid uploading sensitive information.
          # Optional. Default is 'false'
          include-hidden-files: false


  build-quartz:
    needs: [ generate-markdown ]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info # TODO: likely no
      - name: clone quartz
        run: git clone https://github.com/jackyzha0/quartz.git
#      - name: Fix permissions
#        run: sudo chown -R $USER:$USER . && chmod -R 777 ./quartz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install quartz deps
        run: npm i
        working-directory: quartz
      - name: create quartz work area
        # Create new quartz, using shortest links (shortest, relative, absolute). -s=dir?
        run: npx quartz create -X new -l shortest
        working-directory: quartz
      - uses: actions/download-artifact@v5
        with:
          name: markdownFiles
          path: ./quartz/content # TODO: ensure ok
#      - name: Install Dependencies
#        run: npm ci # TODO: i?
      - name: Build Quartz
        run: npx quartz build
        working-directory: ./quartz
      - uses: actions/upload-artifact@v4
        with:
          name: finalFiles
          path: ./quartz/public
          if-no-files-found: error
          retention-days: 1 # TODO: ok????
          # The level of compression for Zlib to be applied to the artifact archive.
          # The value can range from 0 to 9. Default is '6'
          compression-level: 6
          overwrite: true
          include-hidden-files: false

  deploy:
    needs: [build-quartz, generate-markdown]
    if: |
      always() && !cancelled()
      && (needs.generate-markdown.result == 'success')
      && needs.build-quartz.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info # TODO: likely no
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_RUNNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cv-deployment
      - uses: actions/download-artifact@v5
        with:
          name: finalFiles
          path: terraform/public
      - name: initialize terraform
        run: terraform init -backend-config='bucket=${{ vars.TERRAFORM_STATE_BUCKET }}' -backend-config='region=${{ env.AWS_REGION }}'
#        env:
#          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
#          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        working-directory: terraform

      - name: plan terraform
        run: terraform plan -var-file='deploy.tfvars' -var 'cloudflare_api_token=${{vars.CLOUDFLARE_API_TOKEN}}' -var 'cloudflare_zone_id=${{vars.CLOUDFLARE_ZONE_ID}}' -var 'aws_region=${{env.AWS_REGION}}' -out=plan.tf
#        env:
#          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
#          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        working-directory: terraform
      - name: apply terraform
        run: terraform apply -auto-approve plan.tf
#        env:
#          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
#          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        working-directory: terraform

#      - name: Deploy to GitHub Pages
#        id: deployment
#        uses: actions/deploy-pages@v4